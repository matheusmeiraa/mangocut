name: Build IPA

# Em todo push e pull request: testa o motor e compila o .ipa sem assinatura (fica como artefato da execução).
# Em tags v*: também publica o .ipa num release e atualiza a fonte AltStore/SideStore no GitHub Pages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Motor (typecheck e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ipa:
    name: IPA sem assinatura
    needs: engine
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Definir a versão
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Empacotar o motor para o JavaScriptCore
        run: npm run build:ios-engine

      - name: Gerar o projeto Xcode
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml

      - name: Compilar
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild build \
            -project ios/MangoCUT.xcodeproj \
            -scheme MangoCUT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # AltStore e SideStore assinam o app no aparelho com a conta Apple do usuário.
      - name: Empacotar o .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MangoCUT.app Payload/
          zip -qry MangoCUT.ipa Payload
          ls -l MangoCUT.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MangoCUT-ipa
          path: MangoCUT.ipa
          if-no-files-found: error

  release:
    name: Release e fonte AltStore/SideStore
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}apps.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: MangoCUT-ipa

      - name: Publicar o release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.ipa.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" MangoCUT.ipa --title "MangoCUT $VERSION" --generate-notes

      - name: Gerar apps.json
        env:
          VERSION: ${{ needs.ipa.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          OWNER_LC="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # Mantém as versões já publicadas (na primeira publicação o arquivo ainda não existe).
          curl -fsSL "https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}/apps.json" -o previous.json || rm -f previous.json
          node scripts/update-source.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --tag "$GITHUB_REF_NAME" \
            --ipa MangoCUT.ipa \
            --previous previous.json \
            --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
